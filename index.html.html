<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DONETECH - Pricelist Sparepart</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Container Utama Aplikasi -->
    <div id="app" class="flex-1 flex flex-col">
        <!-- Render dinamis via JavaScript -->
    </div>

    <!-- Modal Admin Login -->
    <div id="loginModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-slate-900"><i class="fa-solid fa-lock text-blue-600 mr-2"></i>Login Admin DONETECH</h3>
                <button onclick="closeLoginModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                    <input type="text" id="adminUser" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Masukkan username">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" id="adminPass" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Masukkan password">
                </div>
                <div id="loginError" class="text-red-500 text-sm hidden">Username atau password salah!</div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition">Masuk Panel Admin</button>
            </form>
        </div>
    </div>

    <!-- Script Aplikasi Utama -->
    <script>
        // --- DATABASE INDEXEDDB WRAPPER ---
        const DB_NAME = 'DonetechDB';
        const DB_VERSION = 1;
        let db = null;

        const STORES = ['brands', 'models', 'categories', 'grades', 'products', 'settings'];

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    STORES.forEach(store => {
                        if (!database.objectStoreNames.contains(store)) {
                            database.createObjectStore(store, { keyPath: 'id', autoIncrement: true });
                        }
                    });
                };
            });
        }

        function dbTx(storeName, mode, callback) {
            return new Promise((resolve, reject) => {
                if (!db) {
                    reject('Database belum diinisialisasi');
                    return;
                }
                const transaction = db.transaction(storeName, mode);
                const store = transaction.objectStore(storeName);
                let request = callback(store);
                
                transaction.oncomplete = () => resolve(request ? request.result : null);
                transaction.onerror = () => reject(transaction.error);
            });
        }

        // Generic DB Helpers
        async function getAll(store) { return await dbTx(store, 'readonly', s => s.getAll()); }
        async function addRecord(store, data) { data.createdAt = new Date().toISOString(); return await dbTx(store, 'readwrite', s => s.add(data)); }
        async function updateRecord(store, data) { data.updatedAt = new Date().toISOString(); return await dbTx(store, 'readwrite', s => s.put(data)); }
        async function deleteRecord(store, id) { return await dbTx(store, 'readwrite', s => s.delete(Number(id))); }

        // --- STATE MANAGEMENT ---
        let state = {
            view: 'customer', // customer, admin
            adminTab: 'dashboard',
            selectedBrand: null,
            selectedModel: null,
            selectedCategory: null,
            selectedProduct: null,
            searchQuery: '',
            filterBrand: '',
            filterCategory: '',
            filterGrade: '',
            filterStatus: '',
            sortBy: 'terbaru',
            isAdminLoggedIn: false,
            // Cache data
            brands: [],
            models: [],
            categories: [],
            grades: [],
            products: [],
            settings: {
                storeName: 'DONETECH',
                tagline: 'SERVICE HP & LAPTOP',
                address: 'Dk. Jetis 002/001, Kuwukan, Dawe, Kudus',
                whatsapp: '0821-3393-5158',
                logo: ''
            }
        };

        // --- LOAD INITIAL DATA ---
        async function loadAppData() {
            try {
                await initDB();
                state.brands = await getAll('brands');
                state.models = await getAll('models');
                state.categories = await getAll('categories');
                state.grades = await getAll('grades');
                state.products = await getAll('products');
                
                const settingsList = await getAll('settings');
                if (settingsList.length > 0) {
                    state.settings = settingsList[0];
                } else {
                    // Simpan default setting jika kosong
                    await addRecord('settings', state.settings);
                    const allSets = await getAll('settings');
                    state.settings = allSets[0];
                }
            } catch (err) {
                console.error('Gagal memuat database:', err);
            }
            render();
        }

        // --- ROUTING & RENDER ---
        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (state.view === 'customer') {
                app.innerHTML = renderCustomerView();
            } else if (state.view === 'admin') {
                if (!state.isAdminLoggedIn) {
                    state.view = 'customer';
                    openLoginModal();
                    render();
                    return;
                }
                app.innerHTML = renderAdminView();
            }
        }

        // --- CUSTOMER VIEW COMPONENTS ---
        function renderCustomerView() {
            const waNumberClean = state.settings.whatsapp.replace(/[^0-9]/g, '');
            const normalizedWA = waNumberClean.startsWith('0') ? '62' + waNumberClean.slice(1) : waNumberClean;

            return `
                <!-- Header Toko -->
                <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
                    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div class="flex items-center gap-3 cursor-pointer" onclick="resetCustomerNav()">
                            ${state.settings.logo ? `<img src="${state.settings.logo}" class="w-12 h-12 object-contain rounded-lg border">` : `<div class="w-12 h-12 bg-blue-600 text-white rounded-lg flex items-center justify-center font-bold text-xl"><i class="fa-solid fa-screwdriver-wrench"></i></div>`}
                            <div>
                                <h1 class="text-xl font-bold text-slate-900 uppercase">${state.settings.storeName}</h1>
                                <p class="text-xs text-slate-500 font-medium">${state.settings.tagline} - PRICELIST SPAREPART</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                            <div class="relative flex-1 sm:w-80">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-search"></i></span>
                                <input type="text" id="globalSearch" value="${state.searchQuery}" oninput="handleGlobalSearch(this.value)" placeholder="Cari sparepart, brand, model..." class="w-full pl-10 pr-4 py-2 bg-slate-100 border-none rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:bg-white focus:outline-none transition">
                            </div>
                            <button onclick="openLoginModal()" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center gap-2"><i class="fa-solid fa-user-shield"></i> <span class="hidden md:inline">Admin</span></button>
                        </div>
                    </div>
                </header>

                <!-- Main Content Area -->
                <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
                    <!-- Breadcrumb Navigasi -->
                    <nav class="flex items-center text-sm text-slate-500 mb-6 space-x-2 overflow-x-auto whitespace-nowrap pb-2">
                        <button onclick="resetCustomerNav()" class="hover:text-blue-600 font-medium"><i class="fa-solid fa-house mr-1"></i> Beranda</button>
                        ${state.selectedBrand ? `<span class="text-slate-300">/</span> <button onclick="selectBrand(null)" class="hover:text-blue-600 font-medium">${getBrandName(state.selectedBrand)}</button>` : ''}
                        ${state.selectedModel ? `<span class="text-slate-300">/</span> <button onclick="selectModel(null)" class="hover:text-blue-600 font-medium">${getModelName(state.selectedModel)}</button>` : ''}
                        ${state.selectedCategory ? `<span class="text-slate-300">/</span> <span class="text-slate-900 font-semibold">${getCategoryName(state.selectedCategory)}</span>` : ''}
                    </nav>

                    ${state.searchQuery.trim() !== '' ? renderSearchResults() : renderBrowseFlow()}
                </main>

                <!-- Footer Informasi -->
                <footer class="bg-white border-t border-slate-200 mt-12 py-8 text-sm text-slate-600">
                    <div class="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <h3 class="font-bold text-slate-900 text-base mb-2 uppercase">${state.settings.storeName}</h3>
                            <p class="text-slate-500 text-xs leading-relaxed">${state.settings.tagline}</p>
                        </div>
                        <div>
                            <h4 class="font-semibold text-slate-900 mb-2">Alamat Toko</h4>
                            <p class="text-slate-500 text-xs leading-relaxed"><i class="fa-solid fa-location-dot text-red-500 mr-1"></i> ${state.settings.address}</p>
                        </div>
                        <div>
                            <h4 class="font-semibold text-slate-900 mb-2">Layanan Cepat WhatsApp</h4>
                            <a href="https://wa.me/${normalizedWA}" target="_blank" class="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-semibold transition"><i class="fa-brands fa-whatsapp text-base"></i> ${state.settings.whatsapp}</a>
                        </div>
                    </div>
                </footer>
            `;
        }

        function renderBrowseFlow() {
            if (state.selectedProduct) {
                return renderProductDetail();
            } else if (state.selectedCategory) {
                return renderProductList();
            } else if (state.selectedModel) {
                return renderCategoryList();
            } else if (state.selectedBrand) {
                return renderModelList();
            } else {
                return renderBrandGrid();
            }
        }

        // 1. BRAND GRID
        function renderBrandGrid() {
            const activeBrands = state.brands.filter(b => b.status !== 'nonaktif').sort((a,b) => (a.urutan || 0) - (b.urutan || 0));
            if (activeBrands.length === 0) {
                return `
                    <div class="text-center py-20 bg-white rounded-2xl border border-slate-200 p-8 shadow-xs">
                        <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl"><i class="fa-solid fa-mobile-screen"></i></div>
                        <h2 class="text-lg font-bold text-slate-800 mb-1">Belum ada sparepart tersedia.</h2>
                        <p class="text-sm text-slate-500">Admin dapat menambahkan data brand melalui panel Admin.</p>
                    </div>
                `;
            }

            return `
                <div class="mb-6">
                    <h2 class="text-xl font-bold text-slate-900 mb-1">Pilih Brand Smartphone / Laptop</h2>
                    <p class="text-sm text-slate-500">Silakan pilih brand perangkat yang ingin Anda servis atau cari sparepart-nya.</p>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                    ${activeBrands.map(brand => `
                        <div onclick="selectBrand(${brand.id})" class="bg-white hover:border-blue-500 border border-slate-200 rounded-2xl p-5 flex flex-col items-center justify-center text-center cursor-pointer transition hover:shadow-md group">
                            <div class="w-16 h-16 mb-3 flex items-center justify-center bg-slate-50 rounded-xl group-hover:scale-105 transition overflow-hidden">
                                ${brand.logo ? `<img src="${brand.logo}" class="w-full h-full object-contain">` : `<i class="fa-solid fa-mobile text-2xl text-slate-400"></i>`}
                            </div>
                            <span class="font-semibold text-sm text-slate-800 group-hover:text-blue-600 transition">${brand.nama}</span>
                            <span class="text-[10px] text-slate-400 mt-0.5">${brand.logo ? '' : 'Logo belum tersedia'}</span>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // 2. MODEL LIST
        function renderModelList() {
            const models = state.models.filter(m => m.brandId == state.selectedBrand && m.status !== 'nonaktif').sort((a,b) => (a.urutan || 0) - (b.urutan || 0));
            const brand = state.brands.find(b => b.id == state.selectedBrand);

            return `
                <div class="mb-6 flex items-center justify-between">
                    <div>
                        <h2 class="text-xl font-bold text-slate-900 mb-1">Brand: ${brand ? brand.nama : ''}</h2>
                        <p class="text-sm text-slate-500">Pilih model perangkat untuk melihat jenis sparepart.</p>
                    </div>
                    <button onclick="selectBrand(null)" class="text-sm text-blue-600 hover:underline font-semibold"><i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Brand</button>
                </div>
                ${models.length === 0 ? `
                    <div class="text-center py-16 bg-white rounded-2xl border border-slate-200 p-8">
                        <p class="text-slate-500 font-medium">Belum ada model untuk brand ini.</p>
                    </div>
                ` : `
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                        ${models.map(m => `
                            <div onclick="selectModel(${m.id})" class="bg-white hover:border-blue-500 border border-slate-200 rounded-2xl p-4 flex flex-col items-center text-center cursor-pointer transition hover:shadow-md group">
                                <div class="w-20 h-20 bg-slate-50 rounded-xl mb-3 flex items-center justify-center overflow-hidden">
                                    ${m.foto ? `<img src="${m.foto}" class="w-full h-full object-contain">` : `<i class="fa-solid fa-tablet-screen-button text-3xl text-slate-300"></i>`}
                                </div>
                                <h3 class="font-bold text-sm text-slate-800 group-hover:text-blue-600 transition">${m.namaModel}</h3>
                                ${m.deskripsi ? `<p class="text-xs text-slate-400 mt-1 line-clamp-1">${m.deskripsi}</p>` : ''}
                            </div>
                        `).join('')}
                    </div>
                `}
            `;
        }

        // 3. CATEGORY (JENIS SPAREPART) LIST
        function renderCategoryList() {
            const categories = state.categories.filter(c => c.status !== 'nonaktif').sort((a,b) => (a.urutan || 0) - (b.urutan || 0));
            const brand = state.brands.find(b => b.id == state.selectedBrand);
            const model = state.models.find(m => m.id == state.selectedModel);

            return `
                <div class="mb-6 flex items-center justify-between">
                    <div>
                        <h2 class="text-xl font-bold text-slate-900 mb-1">${brand?.nama} - ${model?.namaModel}</h2>
                        <p class="text-sm text-slate-500">Pilih jenis sparepart yang Anda cari.</p>
                    </div>
                    <button onclick="selectModel(null)" class="text-sm text-blue-600 hover:underline font-semibold"><i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Model</button>
                </div>
                ${categories.length === 0 ? `
                    <div class="text-center py-16 bg-white rounded-2xl border border-slate-200 p-8">
                        <p class="text-slate-500 font-medium">Belum ada jenis sparepart aktif.</p>
                    </div>
                ` : `
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                        ${categories.map(cat => `
                            <div onclick="selectCategory(${cat.id})" class="bg-white hover:border-blue-500 border border-slate-200 rounded-2xl p-4 flex flex-col items-center text-center cursor-pointer transition hover:shadow-md group">
                                <div class="w-16 h-16 bg-slate-50 rounded-xl mb-3 flex items-center justify-center overflow-hidden">
                                    ${cat.foto ? `<img src="${cat.foto}" class="w-full h-full object-contain">` : `<i class="fa-solid fa-gear text-2xl text-slate-300"></i>`}
                                </div>
                                <h3 class="font-bold text-sm text-slate-800 group-hover:text-blue-600 transition">${cat.namaJenis}</h3>
                                <span class="text-[10px] text-slate-400 mt-0.5">${cat.foto ? '' : 'Foto belum tersedia'}</span>
                            </div>
                        `).join('')}
                    </div>
                `}
            `;
        }

        // 4. PRODUCT LIST
        function renderProductList() {
            const brand = state.brands.find(b => b.id == state.selectedBrand);
            const model = state.models.find(m => m.id == state.selectedModel);
            const category = state.categories.find(c => c.id == state.selectedCategory);

            let products = state.products.filter(p => p.brandId == state.selectedBrand && p.modelId == state.selectedModel && p.categoryId == state.selectedCategory);

            // Filter tambahan jika ada
            if (state.filterGrade) products = products.filter(p => p.gradeId == state.filterGrade);
            if (state.filterStatus) products = products.filter(p => p.status === state.filterStatus);

            // Sorting
            products.sort((a,b) => {
                if (state.sortBy === 'terbaru') return new Date(b.createdAt) - new Date(a.createdAt);
                if (state.sortBy === 'az') return a.namaSparepart.localeCompare(b.namaSparepart);
                if (state.sortBy === 'za') return b.namaSparepart.localeCompare(a.namaSparepart);
                if (state.sortBy === 'termurah') return Number(a.harga) - Number(b.harga);
                if (state.sortBy === 'termahal') return Number(b.harga) - Number(a.harga);
                return 0;
            });

            return `
                <div class="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                        <h2 class="text-xl font-bold text-slate-900 mb-1">${brand?.nama} &gt; ${model?.namaModel} &gt; ${category?.namaJenis}</h2>
                        <p class="text-sm text-slate-500">Daftar pilihan grade dan harga sparepart.</p>
                    </div>
                    <button onclick="selectCategory(null)" class="text-sm text-blue-600 hover:underline font-semibold"><i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Jenis Sparepart</button>
                </div>

                <!-- Filter & Sorting Bar -->
                <div class="bg-white p-4 rounded-2xl border border-slate-200 mb-6 flex flex-wrap gap-3 items-center justify-between">
                    <div class="flex flex-wrap gap-2 items-center w-full md:w-auto">
                        <select onchange="state.filterGrade = this.value; render();" class="bg-slate-100 border-none rounded-xl px-3 py-2 text-xs font-medium focus:ring-2 focus:ring-blue-500">
                            <option value="">Semua Grade</option>
                            ${state.grades.map(g => `<option value="${g.id}" ${state.filterGrade == g.id ? 'selected' : ''}>${g.namaGrade}</option>`).join('')}
                        </select>
                        <select onchange="state.filterStatus = this.value; render();" class="bg-slate-100 border-none rounded-xl px-3 py-2 text-xs font-medium focus:ring-2 focus:ring-blue-500">
                            <option value="">Semua Status</option>
                            <option value="Tersedia" ${state.filterStatus === 'Tersedia' ? 'selected' : ''}>Tersedia</option>
                            <option value="Stok Terbatas" ${state.filterStatus === 'Stok Terbatas' ? 'selected' : ''}>Stok Terbatas</option>
                            <option value="Habis" ${state.filterStatus === 'Habis' ? 'selected' : ''}>Habis</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                        <span class="text-xs text-slate-500">Urutkan:</span>
                        <select onchange="state.sortBy = this.value; render();" class="bg-slate-100 border-none rounded-xl px-3 py-2 text-xs font-medium focus:ring-2 focus:ring-blue-500">
                            <option value="terbaru" ${state.sortBy === 'terbaru' ? 'selected' : ''}>Terbaru</option>
                            <option value="az" ${state.sortBy === 'az' ? 'selected' : ''}>A-Z</option>
                            <option value="za" ${state.sortBy === 'za' ? 'selected' : ''}>Z-A</option>
                            <option value="termurah" ${state.sortBy === 'termurah' ? 'selected' : ''}>Harga Termurah</option>
                            <option value="termahal" ${state.sortBy === 'termahal' ? 'selected' : ''}>Harga Termahal</option>
                        </select>
                    </div>
                </div>

                ${products.length === 0 ? `
                    <div class="text-center py-16 bg-white rounded-2xl border border-slate-200 p-8">
                        <p class="text-slate-500 font-medium">Sparepart tidak ditemukan.</p>
                    </div>
                ` : `
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                        ${products.map(p => {
                            const gradeObj = state.grades.find(g => g.id == p.gradeId);
                            const statusColor = p.status === 'Tersedia' ? 'bg-emerald-100 text-emerald-800' : p.status === 'Stok Terbatas' ? 'bg-amber-100 text-amber-800' : 'bg-red-100 text-red-800';
                            return `
                                <div onclick="selectProduct(${p.id})" class="bg-white border border-slate-200 rounded-2xl p-5 flex flex-col justify-between cursor-pointer hover:border-blue-500 transition hover:shadow-md group">
                                    <div>
                                        <div class="w-full h-48 bg-slate-50 rounded-xl mb-4 overflow-hidden flex items-center justify-center">
                                            ${p.foto ? `<img src="${p.foto}" class="w-full h-full object-cover group-hover:scale-105 transition">` : `<i class="fa-solid fa-image text-4xl text-slate-300"></i>`}
                                        </div>
                                        <div class="flex items-center justify-between mb-2">
                                            <span class="text-xs font-bold uppercase tracking-wider text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg">${gradeObj ? gradeObj.namaGrade : 'Standard'}</span>
                                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${statusColor}">${p.status}</span>
                                        </div>
                                        <h3 class="font-bold text-base text-slate-900 group-hover:text-blue-600 transition mb-1">${p.namaSparepart}</h3>
                                        <p class="text-xs text-slate-500 line-clamp-2 mb-4">${p.deskripsi || 'Tidak ada deskripsi.'}</p>
                                    </div>
                                    <div class="flex items-center justify-between pt-4 border-t border-slate-100">
                                        <span class="text-lg font-extrabold text-slate-900">${formatRupiah(p.harga)}</span>
                                        <span class="text-xs font-semibold text-blue-600 group-hover:translate-x-1 transition flex items-center gap-1">Detail <i class="fa-solid fa-chevron-right text-[10px]"></i></span>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `}
            `;
        }

        // 5. DETAIL PRODUK & WHATSAPP
        function renderProductDetail() {
            const product = state.products.find(p => p.id == state.selectedProduct);
            if (!product) return '';

            const brand = state.brands.find(b => b.id == product.brandId);
            const model = state.models.find(m => m.id == product.modelId);
            const category = state.categories.find(c => c.id == product.categoryId);
            const grade = state.grades.find(g => g.id == product.gradeId);

            const statusColor = product.status === 'Tersedia' ? 'bg-emerald-100 text-emerald-800' : product.status === 'Stok Terbatas' ? 'bg-amber-100 text-amber-800' : 'bg-red-100 text-red-800';

        // 6. SEARCH RESULTS (REALTIME GLOBAL SEARCH)
        function renderSearchResults() {
            const query = state.searchQuery.toLowerCase();
            const results = state.products.filter(p => {
                const brand = state.brands.find(b => b.id == p.brandId)?.nama.toLowerCase() || '';
                const model = state.models.find(m => m.id == p.modelId)?.namaModel.toLowerCase() || '';

                const grade = state.grades.find(g => g.id == p.gradeId)?.namaGrade.toLowerCase() || '';
                const name = p.namaSparepart.toLowerCase();
                const desc = (p.deskripsi || '').toLowerCase();

                return brand.includes(query) || model.includes(query) || category.includes(query) || grade.includes(query) || name.includes(query) || desc.includes(query);

            return `

        function openBrandModal(id = null) {
            document.getElementById('brandModal').classList.remove('hidden');
            if (id) {
                const b = state.brands.find(x => x.id == id);
                document.getElementById('brandModalTitle').innerText = 'Edit Brand';
                document.getElementById('brandId').value = b.id;
                document.getElementById('brandNama').value = b.nama;
                document.getElementById('brandUrutan').value = b.urutan || 0;
                document.getElementById('brandStatus').value = b.status || 'aktif';
                document.getElementById('brandLogoInput').value = b.logo || '';
                if (b.logo) {
                    document.getElementById('brandLogoPreview').src = b.logo;
                    document.getElementById('brandLogoPreviewContainer').classList.remove('hidden');
                } else {
                    document.getElementById('brandLogoPreviewContainer').classList.add('hidden');
                }
            } else {
                document.getElementById('brandModalTitle').innerText = 'Tambah Brand';
                document.getElementById('brandId').value = '';
                document.getElementById('brandNama').value = '';
                document.getElementById('brandUrutan').value = '0';
                document.getElementById('brandStatus').value = 'aktif';
                document.getElementById('brandLogoInput').value = '';
                document.getElementById('brandLogoPreviewContainer').classList.add('hidden');
            }
        }
        function closeBrandModal() { document.getElementById('brandModal').classList.add('hidden'); }

        async function saveBrand(e) {
            e.preventDefault();
            const id = document.getElementById('brandId').value;
            const data = {
                nama: document.getElementById('brandNama').value,
                logo: document.getElementById('brandLogoInput').value,
                urutan: Number(document.getElementById('brandUrutan').value),
                status: document.getElementById('brandStatus').value
            };
            if (id) {
                data.id = Number(id);
                await updateRecord('brands', data);
            } else {
                await addRecord('brands', data);
            }
            state.brands = await getAll('brands');
            closeBrandModal();
            render();
        }

        async function deleteBrandItem(id) {
            const relatedModels = state.models.filter(m => m.brandId == id);
            if (relatedModels.length > 0) {
                alert('Brand ini masih memiliki model terkait! Hapus atau pindahkan model terlebih dahulu.');
                return;
            }
            if (confirm('Apakah Anda yakin ingin menghapus brand ini?')) {
                await deleteRecord('brands', id);
                state.brands = await getAll('brands');
                render();
            }
        }

                                <label class="block text-sm font-medium text-slate-700 mb-1">Deskripsi Produk</label>

        function filterAdminModels(brandId, selectedModelId = null) {
            const modelSelect = document.getElementById('productModelId');
            modelSelect.innerHTML = '<option value="">Pilih Model</option>';
            const filtered = state.models.filter(m => m.brandId == brandId);
            filtered.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.innerText = m.namaModel;
                if (selectedModelId && m.id == selectedModelId) opt.selected = true;
                modelSelect.appendChild(opt);
            });
        }

        function openProductModal(id = null) {
            document.getElementById('productModal').classList.remove('hidden');
            if (id) {
                const p = state.products.find(x => x.id == id);
                document.getElementById('productModalTitle').innerText = 'Edit Produk';
                document.getElementById('productId').value = p.id;
                document.getElementById('productBrandId').value = p.brandId;
                filterAdminModels(p.brandId, p.modelId);
                document.getElementById('productCategoryId').value = p.categoryId;
                document.getElementById('productGradeId').value = p.gradeId;
                document.getElementById('productNama').value = p.namaSparepart;
                document.getElementById('productHarga').value = p.harga;
                document.getElementById('productStatus').value = p.status;
                document.getElementById('productDeskripsi').value = p.deskripsi || '';
                document.getElementById('productFotoInput').value = p.foto || '';
                if (p.foto) {
                    document.getElementById('productFotoPreview').src = p.foto;
                    document.getElementById('productFotoPreviewContainer').classList.remove('hidden');
                } else {
                    document.getElementById('productFotoPreviewContainer').classList.add('hidden');
                }
            } else {
                document.getElementById('productModalTitle').innerText = 'Tambah Produk';
                document.getElementById('productId').value = '';
                document.getElementById('productBrandId').value = '';
                document.getElementById('productModelId').innerHTML = '<option value="">Pilih Model</option>';
                document.getElementById('productCategoryId').value = '';
                document.getElementById('productGradeId').value = '';
                document.getElementById('productNama').value = '';
                document.getElementById('productHarga').value = '';
                document.getElementById('productStatus').value = 'Tersedia';
                document.getElementById('productDeskripsi').value = '';
                document.getElementById('productFotoInput').value = '';
                document.getElementById('productFotoPreviewContainer').classList.add('hidden');
            }
        }
        function closeProductModal() { document.getElementById('productModal').classList.add('hidden'); }

        async function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('productId').value;
            const data = {
                brandId: Number(document.getElementById('productBrandId').value),
                modelId: Number(document.getElementById('productModelId').value),
                categoryId: Number(document.getElementById('productCategoryId').value),
                gradeId: Number(document.getElementById('productGradeId').value),
                namaSparepart: document.getElementById('productNama').value,
                harga: Number(document.getElementById('productHarga').value),
                status: document.getElementById('productStatus').value,
                foto: document.getElementById('productFotoInput').value,
                deskripsi: document.getElementById('productDeskripsi').value
            };
            if (id) {
                data.id = Number(id);
                await updateRecord('products', data);
            } else {
                await addRecord('products', data);
            }
            state.products = await getAll('products');
            closeProductModal();
            render();
        }

        async function deleteProductItem(id) {
            if (confirm('Apakah Anda yakin ingin menghapus produk ini?')) {
                await deleteRecord('products', id);
                state.products = await getAll('products');
                render();
            }
        }


        // --- ADMIN SETTINGS ---
        function renderAdminSettings() {
            return `

                </div>

        // --- BACKUP & RESTORE ---
        function renderAdminBackup() {
            return `
                <div class="mb-8">
                    <h2 class="text-2xl font-bold text-slate-900 mb-1">Backup &amp; Restore Data</h2>
                    <p class="text-sm text-slate-500">Unduh seluruh database aplikasi atau pulihkan dari file backup.</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl">
                    <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-slate-900 text-lg mb-2"><i class="fa-solid fa-download text-blue-600 mr-2"></i> Backup Database</h3>
                            <p class="text-xs text-slate-500 mb-6 leading-relaxed">Simpan seluruh data brand, model, jenis sparepart, grade, produk, dan pengaturan toko ke dalam satu file cadangan.</p>
                        </div>
                        <button onclick="downloadBackup()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl text-sm font-semibold transition">Unduh File Backup</button>
                    </div>
                    <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-slate-900 text-lg mb-2"><i class="fa-solid fa-upload text-blue-600 mr-2"></i> Restore Database</h3>
                            <p class="text-xs text-slate-500 mb-6 leading-relaxed">Pilih file backup sebelumnya untuk memulihkan seluruh data aplikasi.</p>
                            <input type="file" id="restoreFile" accept=".json" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 mb-4">
                        </div>
                        <button onclick="processRestore()" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-3 rounded-xl text-sm font-semibold transition">Pulihkan Data</button>
                    </div>
                </div>
            `;
        }

        async function downloadBackup() {
            const backupData = {
                brands: await getAll('brands'),
                models: await getAll('models'),
                categories: await getAll('categories'),
                grades: await getAll('grades'),
                products: await getAll('products'),
                settings: await getAll('settings')
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `donetech_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        async function processRestore() {
            const fileInput = document.getElementById('restoreFile');
            if (!fileInput.files || fileInput.files.length === 0) {
                alert('Pilih file backup terlebih dahulu!');
                return;
            }
            if (!confirm('PERINGATAN: Restore akan menimpa seluruh data yang ada saat ini. Lanjutkan?')) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    // Hapus dan masukkan ulang data per store
                    for (const storeName of STORES) {
                        const existing = await getAll(storeName);
                        for (const item of existing) {
                            await deleteRecord(storeName, item.id);
                        }
                        if (data[storeName]) {
                            for (const item of data[storeName]) {
                                delete item.id; // biarkan autoIncrement membuat id baru
                                await addRecord(storeName, item);
                            }
                        }
                    }
                    alert('Restore database berhasil!');
                    await loadAppData();
                } catch (err) {
                    console.error(err);
                    alert('Gagal membaca file backup!');
                }
            };
            reader.readAsText(fileInput.files[0]);
        }


        // --- UTILS & HELPERS ---
        function formatRupiah(num) {
            return 'Rp' + Number(num).toLocaleString('id-ID');
        }

        function previewImage(input, previewImgId, hiddenInputId) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById(previewImgId).src = e.target.result;
                    document.getElementById(previewImgId.replace('Preview', 'PreviewContainer')).classList.remove('hidden');
                    document.getElementById(hiddenInputId).value = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function getBrandName(id) { return state.brands.find(b => b.id == id)?.nama || ''; }
        function getModelName(id) { return state.models.find(m => m.id == id)?.namaModel || ''; }
        function getCategoryName(id) { return state.categories.find(c => c.id == id)?.namaJenis || ''; }

        // --- AUTH ADMIN ---
        function openLoginModal() { document.getElementById('loginModal').classList.remove('hidden'); }
        function closeLoginModal() { document.getElementById('loginModal').classList.add('hidden'); document.getElementById('loginError').classList.add('hidden'); }
        
        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('adminUser').value;
            const p = document.getElementById('adminPass').value;
            if (u === 'admin' && p === 'donetech123') {
                state.isAdminLoggedIn = true;
                state.view = 'admin';
                closeLoginModal();
                render();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function logoutAdmin() {
            state.isAdminLoggedIn = false;
            state.view = 'customer';
            render();
        }

        // --- INIT ON LOAD ---
        window.onload = () => {
            loadAppData();
        };
    </script>
